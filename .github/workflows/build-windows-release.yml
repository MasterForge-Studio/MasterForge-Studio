name: Build Windows Release

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build and update
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: build-windows-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"

          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' does not match package.json version '$packageVersion' (expected '$expectedTag')."
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY | Out-Null

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 installer
        # --publish never: electron-builder must not upload on its own because
        # GH_TOKEN is set. The next steps upload a matching set explicitly.
        run: npm run dist:win -- --publish never

      - name: Locate Windows installer
        id: installer
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $assetName = "MasterForge-Studio-Setup-$packageVersion-x64.exe"
          $installerPath = Join-Path $env:GITHUB_WORKSPACE "release\$assetName"

          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            $generatedExecutables = @(
              Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "release") `
                -File `
                -Filter "*.exe" `
                -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName
            )

            $found = if ($generatedExecutables.Count) {
              $generatedExecutables -join ", "
            } else {
              "none"
            }

            throw "Expected installer '$installerPath' was not generated. Root-level .exe files found in release/: $found"
          }

          "path=$installerPath" >> $env:GITHUB_OUTPUT
          "name=$assetName" >> $env:GITHUB_OUTPUT

      # This build replaces the installer that tools/release.ps1 uploaded, so
      # every file that describes the installer is replaced from this build too:
      # blockmap, SHA-256 checksum file and latest.yml (the auto-updater's
      # sha512). latest.yml goes last so the updater never sees a new
      # latest.yml before the matching installer.
      - name: Attach installer and matching update files to GitHub Release
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
          INSTALLER_NAME: ${{ steps.installer.outputs.name }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $blockmapPath = "$env:INSTALLER_PATH.blockmap"
          $checksumPath = "$env:INSTALLER_PATH.sha256"
          $latestYmlPath = Join-Path $env:GITHUB_WORKSPACE "release\latest.yml"

          foreach ($required in @($blockmapPath, $latestYmlPath)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Expected build output '$required' was not generated."
            }
          }

          if ((Get-Content -LiteralPath $latestYmlPath -Raw) -notmatch "version:\s*$([regex]::Escape($packageVersion))") {
            throw "latest.yml does not contain the expected version: $packageVersion"
          }

          $checksum = (Get-FileHash -LiteralPath $env:INSTALLER_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $env:INSTALLER_NAME" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          Write-Host "Installer SHA-256: $checksum"

          foreach ($asset in @($blockmapPath, $env:INSTALLER_PATH, $checksumPath, $latestYmlPath)) {
            gh release upload $env:RELEASE_TAG $asset --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Upload failed: $asset" }
          }

      - name: Sync release to WordPress
        shell: pwsh
        run: |
          gh workflow run `
            "sync-release-to-wordpress.yml" `
            --ref $env:GITHUB_DEFAULT_BRANCH `
            --field "release_tag=$env:RELEASE_TAG" `
            --repo $env:GITHUB_REPOSITORY
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
